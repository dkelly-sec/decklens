name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token: read-only unless a job needs more.
permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the storage integration tests. It exists only for
    # this job, so its password is a fixed test value, not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: decklens
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: decklens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decklens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DECKLENS_TEST_DATABASE_URL: postgresql://decklens:ci-test-only@localhost:5432/decklens_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (unit + Postgres integration)
        run: pytest -rs
      - name: Static analysis (bandit)
        run: bandit -r src -q
      - name: Dependency audit (pip-audit)
        run: pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Hardening TODO: pin each action to a full commit SHA instead of a tag,
# so a compromised tag can't change what runs in CI.
