name: CI

on:
  push:
  pull_request:

# Least privilege for the workflow token: read-only unless a job needs more.
permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Static analysis (bandit)
        run: bandit -r src -q
      - name: Dependency audit (pip-audit)
        run: pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Hardening TODO: pin each action to a full commit SHA instead of a tag,
# so a compromised tag can't change what runs in CI.
