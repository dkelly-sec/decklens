name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token: read-only unless a job needs more.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, so a moved or compromised tag can't
# change what runs here. Dependabot (.github/dependabot.yml) raises the pins weekly
# and keeps the version comment beside each one in step.

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the storage integration tests. It exists only for
    # this job, so its password is a fixed test value, not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: decklens
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: decklens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decklens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DECKLENS_TEST_DATABASE_URL: postgresql://decklens:ci-test-only@localhost:5432/decklens_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests (unit + Postgres integration)
        run: pytest -rs
      - name: Static analysis (bandit)
        run: bandit -r src -q
      - name: Dependency audit (pip-audit)
        run: pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # scan the full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
