[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "decklens"
version = "0.1.0"
description = "Clash Royale matchup predictor built on the official API, hardened like a production service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",
    "psycopg[binary]>=3.3.6",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "httpx2>=2.16",  # used by the FastAPI test client
]
# Screen watcher (python -m decklens.watcher), on the PC showing the mirrored phone.
watcher = [
    "mss>=10.2.0",                  # screen capture
    "rapidocr-onnxruntime>=1.2.3",  # offline text recognition (ONNX models bundled)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decklens = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
