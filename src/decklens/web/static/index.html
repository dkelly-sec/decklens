<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeckLens</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preload" href="/static/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="wordmark"><span class="mark" aria-hidden="true"><i></i><i></i></span>DeckLens</p>
      <nav class="pages" aria-label="Pages">
        <div class="tabs" role="tablist">
          <button type="button" class="tab" role="tab" id="page-tab-you" aria-controls="page-you" data-page="you">You</button>
          <button type="button" class="tab" role="tab" id="page-tab-scout" aria-controls="page-scout" data-page="scout">Scout</button>
          <button type="button" class="tab" role="tab" id="page-tab-meta" aria-controls="page-meta" data-page="meta">Meta</button>
        </div>
      </nav>
      <div class="bug" id="watch-bug" hidden>
        <p id="auto-status" class="bug-status" aria-live="polite"></p>
        <button id="rescan-button" type="button" class="quiet" hidden
                title="Read the opponent's name and clan off the battle screen again">Read again</button>
      </div>
      <div id="account" class="account" hidden>
        <span id="account-name"></span>
        <button id="logout-button" type="button" class="quiet">Log out</button>
        <button id="quit-button" type="button" class="quiet" hidden>Quit</button>
      </div>
    </div>
  </header>

  <main>
    <div id="page-you" class="page page-you" role="tabpanel" aria-labelledby="page-tab-you">
      <section aria-labelledby="me-heading" class="you-lookup">
        <h1 id="me-heading">You</h1>
        <form id="me-form" autocomplete="off">
          <label for="me-tag">Your name or player tag</label>
          <div class="row">
            <input id="me-tag" name="tag" placeholder="Name, or #2PPGJQ8V" maxlength="40" required>
            <button type="submit">Look up</button>
          </div>
        </form>
      </section>
      <div id="me-result" class="result"></div>
    </div>

    <div id="page-scout" class="page page-scout" role="tabpanel" aria-labelledby="page-tab-scout" hidden>
      <section id="board" class="board" aria-labelledby="board-heading">
        <h1 id="board-heading" class="visually-hidden">Your opponent</h1>
        <p id="board-said" class="visually-hidden" aria-live="polite"></p>
        <div class="board-strip">
          <div id="board-tools" class="board-tools"></div>
          <label class="switch"><input type="checkbox" id="auto-scout" role="switch">
            <span>Auto-scout from your phone</span></label>
        </div>
        <div id="board-body"></div>
      </section>

      <section class="finder" aria-labelledby="find-heading">
        <div class="finder-head">
          <h2 id="find-heading">Find an opponent</h2>
        </div>
        <form id="find-form" autocomplete="off">
          <div class="field">
            <label for="find-name">Their name</label>
            <input id="find-name" name="name" placeholder="Close is fine" maxlength="40">
          </div>
          <div class="field">
            <label for="find-clan">Their clan</label>
            <input id="find-clan" name="clan" placeholder="Optional, but more accurate" maxlength="40">
          </div>
          <button type="submit">Search</button>
        </form>
        <div id="find-result" class="result"></div>
      </section>
    </div>

    <div id="page-meta" class="page page-meta" role="tabpanel" aria-labelledby="page-tab-meta" hidden>
      <section aria-labelledby="meta-heading">
        <div class="section-head">
          <h1 id="meta-heading">Ranked meta</h1>
          <p class="aside">Last 14 days · mirrors left out</p>
        </div>
        <div id="meta-bands" class="filters" role="group" aria-label="How high on the ladder"></div>
        <div id="meta-result" class="result"></div>
      </section>
    </div>
  </main>

  <footer>
    <p>This content is not affiliated with, endorsed, sponsored, or specifically approved by
      Supercell and Supercell is not responsible for it. For more information see
      <a href="https://supercell.com/en/fan-content-policy/" rel="noopener noreferrer">Supercell's Fan Content Policy</a>.</p>
  </footer>
</body>
</html>
